<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>經典復古掌機合輯</title>
  <style>
    :root {
      --bg-color: #0d0d14;
      --card-bg: #1a1a28;
      --accent-color: #00ffcc;
      --accent-active: #ff007f;
      --accent-gold: #ffcc00;
      --text-color: #f0f0f8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #arcade-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      max-height: 860px;
      display: flex;
      flex-direction: column;
      background: #12121b;
      border: 2px solid #28283d;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    /* 頂部導航 */
    header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #171724;
      border-bottom: 2px solid #242438;
      z-index: 10;
    }

    header h1 {
      font-size: 1.1rem;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    .btn-back {
      background: #33334a;
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .btn-back:active {
      background: var(--accent-active);
    }

    /* 大廳頁 */
    #lobby-view {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2e2e46;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }

    .game-card:active {
      background: #252538;
      border-color: var(--accent-color);
    }

    .game-info h2 {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .game-info p {
      font-size: 0.82rem;
      color: #8c8ca8;
    }

    .game-score {
      font-size: 0.95rem;
      color: var(--accent-gold);
      font-weight: bold;
    }

    /* 遊戲主畫面 */
    #game-view {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 14px 12px;
    }

    #screen-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 50vh;
      background: #08080f;
      border: 2px solid #33334c;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .screen-hint {
      position: absolute;
      top: 6px;
      right: 10px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    /* 控制面板 */
    #controller-panel {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px 0 12px;
    }

    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 6px;
    }

    .d-btn {
      background: #202030;
      border: 2px solid #35354e;
      border-radius: 12px;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #13131e;
    }

    .d-btn:active, .d-btn.active {
      background: var(--accent-color);
      color: #000;
      transform: translateY(3px);
      box-shadow: 0 1px 0 #13131e;
    }

    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 3; }

    .action-pad {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn-action {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2px solid #414160;
      background: #232336;
      color: #fff;
      font-weight: bold;
      font-size: 1.15rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #12121c;
    }

    .btn-action:active, .btn-action.active {
      background: var(--accent-active);
      transform: translateY(3px);
      box-shadow: 0 1px 0 #12121c;
    }
  </style>
</head>
<body>

<div id="arcade-container">
  <header>
    <h1 id="title-text">ARCADE HUB</h1>
    <button id="btn-back" class="btn-back" onclick="switchView('lobby')">返回大廳</button>
  </header>

  <!-- 大廳 -->
  <div id="lobby-view">
    <div class="game-card" onclick="launchGame('pinball')">
      <div class="game-info">
        <h2>夜市彈珠台 🎰 (震撼升級)</h2>
        <p>跑馬燈抽倍率 / 密集釘陣 / 爽感爆彩</p>
      </div>
      <div class="game-score" id="high-pinball">代幣: 100</div>
    </div>

    <div class="game-card" onclick="launchGame('snake')">
      <div class="game-info">
        <h2>貪吃蛇</h2>
        <p>滑動螢幕轉向 / 十字鍵</p>
      </div>
      <div class="game-score" id="high-snake">最高: 0</div>
    </div>

    <div class="game-card" onclick="launchGame('breakout')">
      <div class="game-info">
        <h2>打磚塊</h2>
        <p>觸控直接拖曳 / 左右鍵</p>
      </div>
      <div class="game-score" id="high-breakout">最高: 0</div>
    </div>

    <div class="game-card" onclick="launchGame('tetris')">
      <div class="game-info">
        <h2>俄羅斯方塊</h2>
        <p>A 鍵旋轉 / B 鍵秒落 / 十字鍵</p>
      </div>
      <div class="game-score" id="high-tetris">最高: 0</div>
    </div>
  </div>

  <!-- 遊戲視圖 -->
  <div id="game-view">
    <div id="screen-wrapper">
      <span class="screen-hint" id="screen-hint">操作提示</span>
      <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- 掌機手把 -->
    <div id="controller-panel">
      <div class="d-pad">
        <div class="d-btn d-up" data-action="UP">▲</div>
        <div class="d-btn d-left" data-action="LEFT">◀</div>
        <div class="d-btn d-right" data-action="RIGHT">▶</div>
        <div class="d-btn d-down" data-action="DOWN">▼</div>
      </div>
      <div class="action-pad">
        <div class="btn-action" data-action="ACTION_A">A</div>
        <div class="btn-action" data-action="ACTION_B">B</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================
  // Web Audio 街機音效引擎（免外載音檔，超低延遲）
  // ==========================
  const SoundFX = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    },
    // 釘子碰撞清脆金屬聲
    playPeg(pitchMod = 0) {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const freq = 1200 + pitchMod * 120 + Math.random() * 200;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.06);
    },
    // 發射蓄力咻一聲
    playLaunch() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.22);
    },
    // 跑馬燈切換滴答聲
    playTick() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(600, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.03);
    },
    // 中獎彩金和弦噴發聲
    playWin(big = false) {
      if (!this.ctx) return;
      const notes = big ? [523.25, 659.25, 783.99, 1046.50, 1318.51] : [440, 554.37, 659.25, 880];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(this.ctx.currentTime + idx * 0.08);
        osc.stop(this.ctx.currentTime + idx * 0.08 + 0.4);
      });
    }
  };

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let currentGame = null;
  let animationFrameId = null;

  function switchView(view) {
    const lobby = document.getElementById('lobby-view');
    const game = document.getElementById('game-view');
    const backBtn = document.getElementById('btn-back');
    const titleText = document.getElementById('title-text');

    if (view === 'lobby') {
      if (currentGame && currentGame.destroy) currentGame.destroy();
      cancelAnimationFrame(animationFrameId);
      lobby.style.display = 'flex';
      game.style.display = 'none';
      backBtn.style.display = 'none';
      titleText.innerText = 'ARCADE HUB';
      updateHighScoresUI();
    } else {
      SoundFX.init();
      lobby.style.display = 'none';
      game.style.display = 'flex';
      backBtn.style.display = 'block';
    }
  }

  function launchGame(gameId) {
    switchView('game');
    const hint = document.getElementById('screen-hint');
    if (gameId === 'pinball') {
      document.getElementById('title-text').innerText = '夜市彈珠台';
      hint.innerText = '點 A 押分抽倍率，按住 B 發射';
      currentGame = new PinballGame(ctx);
    } else if (gameId === 'snake') {
      document.getElementById('title-text').innerText = '貪吃蛇';
      hint.innerText = '滑動螢幕轉向';
      currentGame = new SnakeGame(ctx);
    } else if (gameId === 'breakout') {
      document.getElementById('title-text').innerText = '打磚塊';
      hint.innerText = '按住螢幕拖曳板子';
      currentGame = new BreakoutGame(ctx);
    } else if (gameId === 'tetris') {
      document.getElementById('title-text').innerText = '俄羅斯方塊';
      hint.innerText = 'A 旋轉，B 秒落，長按下鍵加速';
      currentGame = new TetrisGame(ctx);
    }
    currentGame.init();
    gameLoop();
  }

  function gameLoop() {
    if (currentGame) {
      currentGame.update();
      currentGame.draw();
      animationFrameId = requestAnimationFrame(gameLoop);
    }
  }

  function triggerHaptic(duration = 20) {
    if (navigator.vibrate) {
      try { navigator.vibrate(duration); } catch(e){}
    }
  }

  function sendInput(action) {
    SoundFX.init();
    triggerHaptic(20);
    if (currentGame && currentGame.handleInput) {
      currentGame.handleInput(action);
    }
  }

  // ==========================
  // 手機全螢幕觸控與拖曳
  // ==========================
  let touchStartX = 0, touchStartY = 0;
  let isTouchingScreen = false;

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    SoundFX.init();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    isTouchingScreen = true;

    const canvasX = ((touch.clientX - rect.left) / rect.width) * 400;
    const canvasY = ((touch.clientY - rect.top) / rect.height) * 400;

    if (currentGame && currentGame.handleTouchStart) {
      currentGame.handleTouchStart(canvasX, canvasY);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!isTouchingScreen) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const canvasX = ((touch.clientX - rect.left) / rect.width) * 400;
    const canvasY = ((touch.clientY - rect.top) / rect.height) * 400;

    if (currentGame && currentGame.handleTouchMove) {
      currentGame.handleTouchMove(canvasX, canvasY);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    isTouchingScreen = false;
    const touch = e.changedTouches[0];
    const rect = canvas.getBoundingClientRect();
    const canvasX = ((touch.clientX - rect.left) / rect.width) * 400;
    const canvasY = ((touch.clientY - rect.top) / rect.height) * 400;

    if (currentGame && currentGame.handleTouchEnd) {
      currentGame.handleTouchEnd(canvasX, canvasY);
    }

    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);

    if (Math.max(absX, absY) > 25) {
      if (absX > absY) {
        sendInput(dx > 0 ? 'RIGHT' : 'LEFT');
      } else {
        sendInput(dy > 0 ? 'DOWN' : 'UP');
      }
    } else {
      sendInput('ACTION_A');
    }
  }, { passive: false });

  // 長按支援
  const buttonRepeatIntervals = {};
  function setupTouchButton(element, action) {
    const startAction = (e) => {
      e.preventDefault();
      SoundFX.init();
      element.classList.add('active');
      sendInput(action);

      if (currentGame && currentGame.handleButtonDown) {
        currentGame.handleButtonDown(action);
      }

      clearInterval(buttonRepeatIntervals[action]);
      buttonRepeatIntervals[action] = setInterval(() => {
        sendInput(action);
      }, 90);
    };

    const stopAction = (e) => {
      e.preventDefault();
      element.classList.remove('active');
      clearInterval(buttonRepeatIntervals[action]);

      if (currentGame && currentGame.handleButtonUp) {
        currentGame.handleButtonUp(action);
      }
    };

    element.addEventListener('touchstart', startAction, { passive: false });
    element.addEventListener('touchend', stopAction, { passive: false });
    element.addEventListener('touchcancel', stopAction, { passive: false });
    element.addEventListener('mousedown', startAction);
    element.addEventListener('mouseup', stopAction);
    element.addEventListener('mouseleave', stopAction);
  }

  document.querySelectorAll('[data-action]').forEach(btn => {
    setupTouchButton(btn, btn.getAttribute('data-action'));
  });

  window.addEventListener('keydown', (e) => {
    SoundFX.init();
    const map = {
      ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT',
      KeyZ: 'ACTION_A', KeyX: 'ACTION_B', Space: 'ACTION_B'
    };
    if (map[e.code]) {
      sendInput(map[e.code]);
      if (currentGame && currentGame.handleButtonDown) currentGame.handleButtonDown(map[e.code]);
    }
  });

  window.addEventListener('keyup', (e) => {
    const map = {
      ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT',
      KeyZ: 'ACTION_A', KeyX: 'ACTION_B', Space: 'ACTION_B'
    };
    if (map[e.code] && currentGame && currentGame.handleButtonUp) {
      currentGame.handleButtonUp(map[e.code]);
    }
  });

  function updateHighScoresUI() {
    document.getElementById('high-snake').innerText = `最高: ${localStorage.getItem('score_snake') || 0}`;
    document.getElementById('high-breakout').innerText = `最高: ${localStorage.getItem('score_breakout') || 0}`;
    const highTetris = document.getElementById('high-tetris');
    if (highTetris) highTetris.innerText = `最高: ${localStorage.getItem('score_tetris') || 0}`;
    const pinballCoins = document.getElementById('high-pinball');
    if (pinballCoins) pinballCoins.innerText = `代幣: ${localStorage.getItem('coins_pinball') || 100}`;
  }

  // ==========================================
  // 夜市彈珠台 (Night Market Pinball) - 震撼升級版
  // ==========================================
  class PinballGame {
    constructor(ctx) {
      this.ctx = ctx;
      this.slotCount = 8;
      this.slotWidth = 330 / this.slotCount; // 8 個軌道 (每軌約 41.25px)
    }

    init() {
      this.coins = parseInt(localStorage.getItem('coins_pinball')) || 100;
      this.bet = 5;
      this.state = 'BETTING'; // 'BETTING', 'ROULETTE', 'AIMING', 'ROLLING', 'RESULT'
      this.multiplier = 2;
      this.activeSlots = [1, 3, 5];
      this.statusMessage = '按 A 鍵押分並抽倍率';

      // 跑馬燈狀態
      this.rouletteList = [2, 3, 5, 10, 50, 2, 3, 5];
      this.rouletteIdx = 0;
      this.rouletteSpeed = 0;
      this.rouletteTimer = 0;

      // 發射與彈簧
      this.springPower = 0;
      this.isCharging = false;
      this.ball = null;

      // 視覺特效：螢幕震動與彩花粒子
      this.shakeIntensity = 0;
      this.particles = [];

      // 釘子陣列：密集 9 排交錯釘子（更具彈跳感與未知性）
      this.pegs = [];
      for (let r = 0; r < 9; r++) {
        const count = r % 2 === 0 ? 8 : 9;
        const startX = r % 2 === 0 ? 32 : 16;
        const gap = 310 / count;
        for (let c = 0; c < count; c++) {
          this.pegs.push({
            x: startX + c * gap + gap / 2,
            y: 110 + r * 25,
            radius: 3.2,
            pulse: 0 // 碰撞發光動畫計時
          });
        }
      }

      this.neonTimer = 0;
    }

    startRoulette() {
      if (this.coins < this.bet) {
        this.coins = 100; // 破產補助
        this.saveCoins();
      }
      this.coins -= this.bet;
      this.saveCoins();

      this.state = 'ROULETTE';
      this.rouletteSpeed = 2; // 初始高轉速
      this.rouletteTimer = 0;
      this.statusMessage = '倍率跑馬燈轉動中...';
    }

    settleRouletteResult() {
      const tiers = [
        { mult: 2, winSlots: 5, weight: 42 },
        { mult: 3, winSlots: 4, weight: 30 },
        { mult: 5, winSlots: 3, weight: 16 },
        { mult: 10, winSlots: 2, weight: 9 },
        { mult: 50, winSlots: 1, weight: 3 }
      ];

      const totalWeight = tiers.reduce((a, b) => a + b.weight, 0);
      let rand = Math.random() * totalWeight;
      let chosen = tiers[0];
      for (let t of tiers) {
        if (rand < t.weight) {
          chosen = t;
          break;
        }
        rand -= t.weight;
      }

      this.multiplier = chosen.mult;

      const pool = [0, 1, 2, 3, 4, 5, 6, 7];
      pool.sort(() => Math.random() - 0.5);
      this.activeSlots = pool.slice(0, chosen.winSlots);

      this.state = 'AIMING';
      this.statusMessage = `抽中 ${this.multiplier}X 倍率！按住 B 蓄力發射`;
      SoundFX.playWin(false);
      triggerHaptic(60);
    }

    handleButtonDown(action) {
      if (this.state === 'AIMING' && (action === 'ACTION_B' || action === 'DOWN')) {
        this.isCharging = true;
      }
    }

    handleButtonUp(action) {
      if (this.state === 'AIMING' && (action === 'ACTION_B' || action === 'DOWN') && this.isCharging) {
        this.launchBall();
      }
    }

    handleInput(action) {
      if (this.state === 'BETTING') {
        if (action === 'ACTION_A') {
          this.startRoulette();
        }
      } else if (this.state === 'RESULT') {
        if (action === 'ACTION_A' || action === 'ACTION_B') {
          this.state = 'BETTING';
          this.statusMessage = '按 A 鍵押分並抽倍率';
        }
      }
    }

    handleTouchStart(canvasX, canvasY) {
      if (this.state === 'AIMING' && canvasX > 340) {
        this.isCharging = true;
      } else if (this.state === 'BETTING') {
        this.startRoulette();
      } else if (this.state === 'RESULT') {
        this.handleInput('ACTION_A');
      }
    }

    handleTouchMove(canvasX, canvasY) {
      if (this.isCharging) {
        const pull = Math.min(100, Math.max(10, (canvasY - 250) * 1.3));
        this.springPower = pull;
      }
    }

    handleTouchEnd() {
      if (this.isCharging) {
        this.launchBall();
      }
    }

    launchBall() {
      this.isCharging = false;
      this.state = 'ROLLING';
      this.statusMessage = '彈珠衝刺中！';
      SoundFX.playLaunch();
      triggerHaptic(70);

      // 蓄力越滿，初始衝刺速度越快 (9 ~ 16)
      const launchSpeed = 9.5 + (this.springPower / 100) * 6.5;
      this.ball = {
        x: 365,
        y: 350,
        vx: 0,
        vy: -launchSpeed,
        radius: 6.5,
        tail: [] // 殘影軌跡
      };
      this.springPower = 0;
    }

    saveCoins() {
      localStorage.setItem('coins_pinball', this.coins);
      const el = document.getElementById('high-pinball');
      if (el) el.innerText = `代幣: ${this.coins}`;
    }

    // 噴發金幣彩花粒子
    spawnWinParticles(x, y, count = 35) {
      const colors = ['#ffcc00', '#ff007f', '#00ffcc', '#ffffff', '#ff9900'];
      for (let i = 0; i < count; i++) {
        this.particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: -Math.random() * 8 - 3,
          size: Math.random() * 5 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: 0.25,
          life: 1.0,
          decay: Math.random() * 0.02 + 0.015
        });
      }
    }

    update() {
      this.neonTimer += 0.08;

      // 跑馬燈開獎減速動畫
      if (this.state === 'ROULETTE') {
        this.rouletteTimer++;
        if (this.rouletteTimer % Math.floor(this.rouletteSpeed) === 0) {
          this.rouletteIdx = (this.rouletteIdx + 1) % this.rouletteList.length;
          SoundFX.playTick();
          triggerHaptic(15);
          this.rouletteSpeed += 0.35; // 逐漸減速
        }
        if (this.rouletteSpeed > 16) {
          this.settleRouletteResult();
        }
      }

      // 發射蓄力
      if (this.isCharging && this.springPower < 100) {
        this.springPower += 2.8;
        if (Math.floor(this.springPower) % 15 === 0) triggerHaptic(10);
      }

      // 釘子光暈消退
      this.pegs.forEach(peg => {
        if (peg.pulse > 0) peg.pulse -= 0.06;
      });

      // 粒子物理更新
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.life -= p.decay;
        if (p.life <= 0) this.particles.splice(i, 1);
      }

      // 螢幕震動衰減
      if (this.shakeIntensity > 0) {
        this.shakeIntensity *= 0.85;
        if (this.shakeIntensity < 0.2) this.shakeIntensity = 0;
      }

      // 彈珠物理引擎
      if (this.state === 'ROLLING' && this.ball) {
        // 殘影紀錄
        this.ball.tail.unshift({ x: this.ball.x, y: this.ball.y });
        if (this.ball.tail.length > 5) this.ball.tail.pop();

        this.ball.vy += 0.17; // 重力加速度
        this.ball.x += this.ball.vx;
        this.ball.y += this.ball.vy;
        this.ball.vx *= 0.99;

        // 頂部圓弧導軌（流暢圓滑切入釘子區）
        if (this.ball.y < 65 && this.ball.x > 330) {
          this.ball.vx = -5.2;
          this.ball.vy = Math.min(this.ball.vy, 0.5);
          triggerHaptic(10);
        }

        // 左右壁碰撞
        if (this.ball.x < 14 + this.ball.radius) {
          this.ball.x = 14 + this.ball.radius;
          this.ball.vx = Math.abs(this.ball.vx) * 0.75;
          SoundFX.playPeg(-2);
          triggerHaptic(12);
        } else if (this.ball.x > 338 - this.ball.radius && this.ball.y > 65) {
          this.ball.x = 338 - this.ball.radius;
          this.ball.vx = -Math.abs(this.ball.vx) * 0.75;
          SoundFX.playPeg(-2);
          triggerHaptic(12);
        }

        // 頂棚反彈
        if (this.ball.y < 12 + this.ball.radius) {
          this.ball.y = 12 + this.ball.radius;
          this.ball.vy = Math.abs(this.ball.vy) * 0.6;
          SoundFX.playPeg(1);
        }

        // 密集釘子碰撞（帶微隨機彈射物理）
        this.pegs.forEach((peg, pIdx) => {
          const dx = this.ball.x - peg.x;
          const dy = this.ball.y - peg.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < this.ball.radius + peg.radius) {
            peg.pulse = 1.0;
            SoundFX.playPeg(pIdx % 6);
            triggerHaptic(18);

            const angle = Math.atan2(dy, dx);
            const speed = Math.sqrt(this.ball.vx * this.ball.vx + this.ball.vy * this.ball.vy) * 0.82;
            // 彈跳微機率晃動，讓下落充滿未知懸疑感
            const wobble = (Math.random() - 0.5) * 1.2;
            this.ball.vx = Math.cos(angle) * (speed + 1.2) + wobble;
            this.ball.vy = Math.sin(angle) * (speed + 1.2);

            this.ball.x = peg.x + Math.cos(angle) * (this.ball.radius + peg.radius);
            this.ball.y = peg.y + Math.sin(angle) * (this.ball.radius + peg.radius);
          }
        });

        // 掉入底槽判定
        if (this.ball.y > 346) {
          const slotIndex = Math.min(7, Math.max(0, Math.floor((this.ball.x - 10) / this.slotWidth)));
          const isWin = this.activeSlots.includes(slotIndex);

          this.state = 'RESULT';
          if (isWin) {
            const winAmount = this.bet * this.multiplier;
            this.coins += winAmount;
            this.saveCoins();
            this.shakeIntensity = this.multiplier >= 10 ? 12 : 7;
            this.spawnWinParticles(this.ball.x, 340, this.multiplier >= 10 ? 60 : 35);
            SoundFX.playWin(this.multiplier >= 10);
            triggerHaptic(250);
            this.statusMessage = `💥 大中獎！贏得 ${winAmount} 代幣！(點 A 鍵續玩)`;
          } else {
            this.statusMessage = `殘念！沒進中獎洞 (點 A 鍵續玩)`;
            triggerHaptic(120);
          }
          this.ball = null;
        }
      }
    }

    draw() {
      // 處理畫面震動 (Screen Shake)
      this.ctx.save();
      if (this.shakeIntensity > 0) {
        const shakeX = (Math.random() - 0.5) * this.shakeIntensity;
        const shakeY = (Math.random() - 0.5) * this.shakeIntensity;
        this.ctx.translate(shakeX, shakeY);
      }

      // 1. 機台主體底板
      this.ctx.fillStyle = '#080911';
      this.ctx.fillRect(0, 0, 400, 400);

      // 2. 頂部倍率走馬燈儀表
      this.ctx.fillStyle = '#141422';
      this.ctx.fillRect(8, 8, 330, 48);
      this.ctx.strokeStyle = '#2b2b42';
      this.ctx.strokeRect(8, 8, 330, 48);

      this.ctx.fillStyle = '#fff';
      this.ctx.font = 'bold 13px sans-serif';
      this.ctx.fillText(`代幣: ${this.coins}`, 18, 36);
      this.ctx.fillText(`押注: ${this.bet}`, 108, 36);

      // 倍率看板 (跑馬燈動畫或鎖定標籤)
      const currentDisplayMult = this.state === 'ROULETTE' ? this.rouletteList[this.rouletteIdx] : this.multiplier;
      const isJackpot = currentDisplayMult >= 10;
      this.ctx.fillStyle = isJackpot ? '#ff0055' : '#00e5ff';
      this.ctx.fillRect(195, 14, 130, 36);
      this.ctx.fillStyle = '#000';
      this.ctx.font = 'bold 15px monospace';
      this.ctx.textAlign = 'center';
      this.ctx.fillText(`倍率: ${currentDisplayMult}X`, 260, 37);
      this.ctx.textAlign = 'start';

      // 3. 右側發射導軌 (345 ~ 392)
      this.ctx.fillStyle = '#10111a';
      this.ctx.fillRect(344, 55, 46, 335);
      this.ctx.strokeStyle = '#28283e';
      this.ctx.strokeRect(344, 55, 46, 335);

      // 頂部圓弧引導導軌
      this.ctx.strokeStyle = '#3d3d5c';
      this.ctx.lineWidth = 3;
      this.ctx.beginPath();
      this.ctx.arc(330, 65, 55, Math.PI * 1.5, Math.PI * 2);
      this.ctx.stroke();

      // 發射彈簧
      const springHeight = 42 - (this.springPower / 100) * 30;
      this.ctx.fillStyle = '#ffaa00';
      this.ctx.fillRect(357, 388 - springHeight, 20, springHeight);

      // 4. 釘子陣列繪製 (附帶碰撞呼吸發光效果)
      this.pegs.forEach(peg => {
        this.ctx.beginPath();
        this.ctx.arc(peg.x, peg.y, peg.radius + (peg.pulse * 1.5), 0, Math.PI * 2);
        if (peg.pulse > 0) {
          this.ctx.fillStyle = '#ffffff';
          this.ctx.shadowColor = '#00ffcc';
          this.ctx.shadowBlur = 12 * peg.pulse;
        } else {
          this.ctx.fillStyle = '#00e5ff';
          this.ctx.shadowBlur = 0;
        }
        this.ctx.fill();
        this.ctx.closePath();
      });
      this.ctx.shadowBlur = 0;

      // 5. 底部 8 條球道
      const bottomY = 345;
      for (let i = 0; i < this.slotCount; i++) {
        const slotX = 8 + i * this.slotWidth;
        const isActive = this.activeSlots.includes(i);

        // 軌道分隔框
        this.ctx.strokeStyle = '#3e3e5c';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(slotX, bottomY, this.slotWidth, 52);

        // 中獎軌道動態霓虹流光
        if (isActive) {
          const glowAlpha = 0.25 + Math.sin(this.neonTimer * 2 + i) * 0.12;
          this.ctx.fillStyle = `rgba(0, 255, 204, ${glowAlpha})`;
        } else {
          this.ctx.fillStyle = 'rgba(255, 0, 80, 0.06)';
        }
        this.ctx.fillRect(slotX + 1, bottomY + 1, this.slotWidth - 2, 50);

        // 指示燈
        this.ctx.beginPath();
        this.ctx.arc(slotX + this.slotWidth / 2, bottomY + 11, 4.5, 0, Math.PI * 2);
        this.ctx.fillStyle = isActive ? '#00ffcc' : '#441122';
        if (isActive) {
          this.ctx.shadowColor = '#00ffcc';
          this.ctx.shadowBlur = 8;
        }
        this.ctx.fill();
        this.ctx.shadowBlur = 0;
        this.ctx.closePath();

        // 軌道文字標籤
        this.ctx.fillStyle = isActive ? '#00ffcc' : '#666';
        this.ctx.font = 'bold 10px monospace';
        this.ctx.textAlign = 'center';
        this.ctx.fillText(isActive ? `${this.multiplier}X` : 'X', slotX + this.slotWidth / 2, bottomY + 36);
        this.ctx.textAlign = 'start';
      }

      // 6. 彈珠與殘影拖尾
      if (this.ball) {
        // 殘影
        this.ball.tail.forEach((pos, idx) => {
          this.ctx.beginPath();
          this.ctx.arc(pos.x, pos.y, this.ball.radius * (1 - idx * 0.18), 0, Math.PI * 2);
          this.ctx.fillStyle = `rgba(255, 255, 255, ${0.4 - idx * 0.08})`;
          this.ctx.fill();
        });

        // 實體鋼珠
        this.ctx.beginPath();
        this.ctx.arc(this.ball.x, this.ball.y, this.ball.radius, 0, Math.PI * 2);
        this.ctx.fillStyle = '#ffffff';
        this.ctx.shadowColor = '#ff007f';
        this.ctx.shadowBlur = 10;
        this.ctx.fill();
        this.ctx.shadowBlur = 0;
        this.ctx.closePath();
      }

      // 7. 彩花粒子爆炸繪製
      this.particles.forEach(p => {
        this.ctx.fillStyle = p.color;
        this.ctx.globalAlpha = p.life;
        this.ctx.fillRect(p.x, p.y, p.size, p.size);
      });
      this.ctx.globalAlpha = 1.0;

      // 8. 狀態訊息與蓄力表
      this.ctx.fillStyle = '#fff';
      this.ctx.font = '12px sans-serif';
      this.ctx.fillText(this.statusMessage, 14, 76);

      if (this.state === 'AIMING') {
        this.ctx.fillStyle = '#ffaa00';
        this.ctx.fillRect(348, 60, 38, (this.springPower / 100) * 110);
        this.ctx.fillStyle = '#fff';
        this.ctx.font = '10px sans-serif';
        this.ctx.fillText('力道', 354, 54);
      }

      this.ctx.restore();
    }

    destroy() {}
  }

  // ==========================
  // 遊戲 1：貪吃蛇 (Snake)
  // ==========================
  class SnakeGame {
    constructor(ctx) {
      this.ctx = ctx;
      this.gridSize = 20;
      this.tileCount = 400 / 20;
    }

    init() {
      this.snake = [{ x: 10, y: 10 }];
      this.food = { x: 15, y: 15 };
      this.dx = 1;
      this.dy = 0;
      this.score = 0;
      this.speedCounter = 0;
      this.isGameOver = false;
    }

    handleInput(action) {
      if (this.isGameOver && (action === 'ACTION_A' || action === 'ACTION_B')) {
        this.init();
        return;
      }
      if (action === 'UP' && this.dy === 0) { this.dx = 0; this.dy = -1; }
      if (action === 'DOWN' && this.dy === 0) { this.dx = 0; this.dy = 1; }
      if (action === 'LEFT' && this.dx === 0) { this.dx = -1; this.dy = 0; }
      if (action === 'RIGHT' && this.dx === 0) { this.dx = 1; this.dy = 0; }
    }

    update() {
      if (this.isGameOver) return;
      if (++this.speedCounter % 8 !== 0) return;

      const head = { x: this.snake[0].x + this.dx, y: this.snake[0].y + this.dy };

      if (head.x < 0 || head.x >= this.tileCount || head.y < 0 || head.y >= this.tileCount) {
        this.triggerGameOver();
        return;
      }

      for (let segment of this.snake) {
        if (head.x === segment.x && head.y === segment.y) {
          this.triggerGameOver();
          return;
        }
      }

      this.snake.unshift(head);

      if (head.x === this.food.x && head.y === this.food.y) {
        this.score += 10;
        SoundFX.playPeg(4);
        triggerHaptic(40);
        this.food = {
          x: Math.floor(Math.random() * this.tileCount),
          y: Math.floor(Math.random() * this.tileCount)
        };
      } else {
        this.snake.pop();
      }
    }

    triggerGameOver() {
      this.isGameOver = true;
      triggerHaptic(150);
      const best = localStorage.getItem('score_snake') || 0;
      if (this.score > best) localStorage.setItem('score_snake', this.score);
    }

    draw() {
      this.ctx.fillStyle = '#101018';
      this.ctx.fillRect(0, 0, 400, 400);

      this.ctx.fillStyle = '#ff007f';
      this.ctx.fillRect(this.food.x * this.gridSize, this.food.y * this.gridSize, this.gridSize - 2, this.gridSize - 2);

      this.ctx.fillStyle = '#00ffcc';
      this.snake.forEach((part) => {
        this.ctx.fillRect(part.x * this.gridSize, part.y * this.gridSize, this.gridSize - 2, this.gridSize - 2);
      });

      this.ctx.fillStyle = '#fff';
      this.ctx.font = '16px monospace';
      this.ctx.fillText(`分數: ${this.score}`, 12, 26);

      if (this.isGameOver) {
        this.ctx.fillStyle = 'rgba(0,0,0,0.75)';
        this.ctx.fillRect(0, 0, 400, 400);
        this.ctx.fillStyle = '#ff3366';
        this.ctx.font = '28px sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('遊戲結束', 200, 180);
        this.ctx.font = '16px sans-serif';
        this.ctx.fillStyle = '#fff';
        this.ctx.fillText('點擊任意處或按 A 重開', 200, 220);
        this.ctx.textAlign = 'start';
      }
    }

    destroy() {}
  }

  // ==========================
  // 遊戲 2：打磚塊 (Breakout)
  // ==========================
  class BreakoutGame {
    constructor(ctx) {
      this.ctx = ctx;
    }

    init() {
      this.paddleWidth = 85;
      this.paddleHeight = 12;
      this.paddleX = 160;
      this.ballX = 200;
      this.ballY = 320;
      this.dx = 3.5;
      this.dy = -3.5;
      this.ballRadius = 6;
      this.score = 0;
      this.isGameOver = false;

      this.bricks = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 6; c++) {
          this.bricks.push({ x: c * 64 + 10, y: r * 24 + 40, status: 1 });
        }
      }
    }

    handleTouchStart(canvasX) {
      if (this.isGameOver) {
        this.init();
        return;
      }
      this.setPaddlePosition(canvasX);
    }

    handleTouchMove(canvasX) {
      if (this.isGameOver) return;
      this.setPaddlePosition(canvasX);
    }

    setPaddlePosition(x) {
      this.paddleX = Math.max(0, Math.min(400 - this.paddleWidth, x - (this.paddleWidth / 2)));
    }

    handleInput(action) {
      if (this.isGameOver && (action === 'ACTION_A' || action === 'ACTION_B')) {
        this.init();
        return;
      }
      if (action === 'LEFT') this.paddleX = Math.max(0, this.paddleX - 20);
      if (action === 'RIGHT') this.paddleX = Math.min(400 - this.paddleWidth, this.paddleX + 20);
    }

    update() {
      if (this.isGameOver) return;

      this.ballX += this.dx;
      this.ballY += this.dy;

      if (this.ballX + this.dx > 400 - this.ballRadius || this.ballX + this.dx < this.ballRadius) {
        this.dx = -this.dx;
        SoundFX.playPeg(-1);
      }
      if (this.ballY + this.dy < this.ballRadius) {
        this.dy = -this.dy;
        SoundFX.playPeg(-1);
      } else if (this.ballY + this.dy > 375) {
        if (this.ballX > this.paddleX && this.ballX < this.paddleX + this.paddleWidth) {
          this.dy = -Math.abs(this.dy);
          const hitOffset = (this.ballX - (this.paddleX + this.paddleWidth / 2)) / (this.paddleWidth / 2);
          this.dx = hitOffset * 4.5;
          SoundFX.playPeg(2);
          triggerHaptic(25);
        } else if (this.ballY > 400) {
          this.triggerGameOver();
          return;
        }
      }

      this.bricks.forEach(b => {
        if (b.status === 1) {
          if (this.ballX > b.x && this.ballX < b.x + 56 && this.ballY > b.y && this.ballY < b.y + 18) {
            this.dy = -this.dy;
            b.status = 0;
            this.score += 20;
            SoundFX.playPeg(5);
            triggerHaptic(30);
          }
        }
      });
    }

    triggerGameOver() {
      this.isGameOver = true;
      triggerHaptic(150);
      const best = localStorage.getItem('score_breakout') || 0;
      if (this.score > best) localStorage.setItem('score_breakout', this.score);
    }

    draw() {
      this.ctx.fillStyle = '#0d111d';
      this.ctx.fillRect(0, 0, 400, 400);

      this.bricks.forEach(b => {
        if (b.status === 1) {
          this.ctx.fillStyle = '#ffaa00';
          this.ctx.fillRect(b.x, b.y, 56, 18);
        }
      });

      this.ctx.fillStyle = '#00ffcc';
      this.ctx.fillRect(this.paddleX, 380, this.paddleWidth, this.paddleHeight);

      this.ctx.beginPath();
      this.ctx.arc(this.ballX, this.ballY, this.ballRadius, 0, Math.PI * 2);
      this.ctx.fillStyle = '#fff';
      this.ctx.fill();
      this.ctx.closePath();

      this.ctx.fillStyle = '#fff';
      this.ctx.font = '16px monospace';
      this.ctx.fillText(`分數: ${this.score}`, 12, 26);

      if (this.isGameOver) {
        this.ctx.fillStyle = 'rgba(0,0,0,0.75)';
        this.ctx.fillRect(0, 0, 400, 400);
        this.ctx.fillStyle = '#ff3366';
        this.ctx.font = '28px sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('遊戲結束', 200, 180);
        this.ctx.font = '16px sans-serif';
        this.ctx.fillStyle = '#fff';
        this.ctx.fillText('點擊任意處或按 A 重開', 200, 220);
        this.ctx.textAlign = 'start';
      }
    }

    destroy() {}
  }

  // ==========================
  // 遊戲 3：俄羅斯方塊 (Tetris)
  // ==========================
  class TetrisGame {
    constructor(ctx) {
      this.ctx = ctx;
      this.cols = 10;
      this.rows = 20;
      this.blockSize = 20;
      this.offsetX = (400 - this.cols * this.blockSize) / 2;
    }

    init() {
      this.board = Array.from({ length: this.rows }, () => Array(this.cols).fill(0));
      this.score = 0;
      this.lines = 0;
      this.dropCounter = 0;
      this.dropInterval = 30;
      this.isGameOver = false;

      this.shapes = {
        I: [[1, 1, 1, 1]],
        J: [[1, 0, 0], [1, 1, 1]],
        L: [[0, 0, 1], [1, 1, 1]],
        O: [[1, 1], [1, 1]],
        S: [[0, 1, 1], [1, 1, 0]],
        T: [[0, 1, 0], [1, 1, 1]],
        Z: [[1, 1, 0], [0, 1, 1]]
      };

      this.colors = {
        I: '#00ffff', J: '#2979ff', L: '#ff9100',
        O: '#ffd600', S: '#00e676', T: '#d500f9', Z: '#ff1744'
      };

      this.spawnPiece();
    }

    spawnPiece() {
      const keys = Object.keys(this.shapes);
      const type = keys[Math.floor(Math.random() * keys.length)];
      this.current = {
        matrix: this.shapes[type],
        color: this.colors[type],
        x: Math.floor((this.cols - this.shapes[type][0].length) / 2),
        y: 0
      };

      if (this.collide(this.current.matrix, this.current.x, this.current.y)) {
        this.triggerGameOver();
      }
    }

    collide(matrix, offsetOriginX, offsetOriginY) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (matrix[y][x] !== 0) {
            const newX = x + offsetOriginX;
            const newY = y + offsetOriginY;
            if (newX < 0 || newX >= this.cols || newY >= this.rows) return true;
            if (newY >= 0 && this.board[newY][newX] !== 0) return true;
          }
        }
      }
      return false;
    }

    rotate(matrix) {
      return matrix[0].map((_, index) => matrix.map(row => row[index]).reverse());
    }

    handleInput(action) {
      if (this.isGameOver && (action === 'ACTION_A' || action === 'ACTION_B')) {
        this.init();
        return;
      }
      if (this.isGameOver) return;

      if (action === 'LEFT') {
        if (!this.collide(this.current.matrix, this.current.x - 1, this.current.y)) {
          this.current.x--;
          SoundFX.playTick();
          triggerHaptic(15);
        }
      } else if (action === 'RIGHT') {
        if (!this.collide(this.current.matrix, this.current.x + 1, this.current.y)) {
          this.current.x++;
          SoundFX.playTick();
          triggerHaptic(15);
        }
      } else if (action === 'DOWN') {
        if (!this.collide(this.current.matrix, this.current.x, this.current.y + 1)) {
          this.current.y++;
          this.score += 1;
        }
      } else if (action === 'ACTION_A' || action === 'UP') {
        const rotated = this.rotate(this.current.matrix);
        if (!this.collide(rotated, this.current.x, this.current.y)) {
          this.current.matrix = rotated;
          SoundFX.playPeg(2);
          triggerHaptic(25);
        }
      } else if (action === 'ACTION_B') {
        while (!this.collide(this.current.matrix, this.current.x, this.current.y + 1)) {
          this.current.y++;
          this.score += 2;
        }
        this.lockPiece();
        SoundFX.playPeg(-1);
        triggerHaptic(40);
      }
    }

    lockPiece() {
      this.current.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            const boardY = y + this.current.y;
            const boardX = x + this.current.x;
            if (boardY >= 0) this.board[boardY][boardX] = this.current.color;
          }
        });
      });

      this.clearLines();
      this.spawnPiece();
    }

    clearLines() {
      let linesCleared = 0;
      for (let y = this.rows - 1; y >= 0; y--) {
        if (this.board[y].every(cell => cell !== 0)) {
          this.board.splice(y, 1);
          this.board.unshift(Array(this.cols).fill(0));
          linesCleared++;
          y++;
        }
      }

      if (linesCleared > 0) {
        const lineScores = [0, 100, 300, 500, 800];
        this.score += lineScores[linesCleared];
        this.lines += linesCleared;
        SoundFX.playWin(linesCleared >= 4);
        triggerHaptic(60);
      }
    }

    update() {
      if (this.isGameOver) return;

      if (++this.dropCounter >= this.dropInterval) {
        this.dropCounter = 0;
        if (!this.collide(this.current.matrix, this.current.x, this.current.y + 1)) {
          this.current.y++;
        } else {
          this.lockPiece();
        }
      }
    }

    triggerGameOver() {
      this.isGameOver = true;
      triggerHaptic(180);
      const best = localStorage.getItem('score_tetris') || 0;
      if (this.score > best) localStorage.setItem('score_tetris', this.score);
    }

    draw() {
      this.ctx.fillStyle = '#0d0d14';
      this.ctx.fillRect(0, 0, 400, 400);

      this.ctx.fillStyle = '#141420';
      this.ctx.fillRect(this.offsetX, 0, this.cols * this.blockSize, 400);

      this.ctx.strokeStyle = '#1e1e2f';
      this.ctx.lineWidth = 1;
      for (let c = 0; c <= this.cols; c++) {
        this.ctx.beginPath();
        this.ctx.moveTo(this.offsetX + c * this.blockSize, 0);
        this.ctx.lineTo(this.offsetX + c * this.blockSize, 400);
        this.ctx.stroke();
      }

      for (let r = 0; r < this.rows; r++) {
        for (let c = 0; c < this.cols; c++) {
          if (this.board[r][c] !== 0) {
            this.ctx.fillStyle = this.board[r][c];
            this.ctx.fillRect(this.offsetX + c * this.blockSize + 1, r * this.blockSize + 1, this.blockSize - 2, this.blockSize - 2);
          }
        }
      }

      if (!this.isGameOver && this.current) {
        this.ctx.fillStyle = this.current.color;
        this.current.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value !== 0) {
              this.ctx.fillRect(
                this.offsetX + (this.current.x + x) * this.blockSize + 1,
                (this.current.y + y) * this.blockSize + 1,
                this.blockSize - 2,
                this.blockSize - 2
              );
            }
          });
        });
      }

      this.ctx.fillStyle = '#fff';
      this.ctx.font = '14px monospace';
      this.ctx.fillText(`分數`, 15, 40);
      this.ctx.fillStyle = '#00ffcc';
      this.ctx.font = '18px monospace';
      this.ctx.fillText(`${this.score}`, 15, 65);

      this.ctx.fillStyle = '#fff';
      this.ctx.font = '14px monospace';
      this.ctx.fillText(`消行`, 15, 110);
      this.ctx.fillStyle = '#ff9100';
      this.ctx.font = '18px monospace';
      this.ctx.fillText(`${this.lines}`, 15, 135);

      if (this.isGameOver) {
        this.ctx.fillStyle = 'rgba(0,0,0,0.8)';
        this.ctx.fillRect(0, 0, 400, 400);
        this.ctx.fillStyle = '#ff3366';
        this.ctx.font = '28px sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('遊戲結束', 200, 180);
        this.ctx.font = '16px sans-serif';
        this.ctx.fillStyle = '#fff';
        this.ctx.fillText('點擊任意處或按 A 重開', 200, 220);
        this.ctx.textAlign = 'start';
      }
    }

    destroy() {}
  }

  updateHighScoresUI();
</script>
